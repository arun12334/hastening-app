<app-header></app-header>

<section class="Join-A-Justserve-Activity-Banner">

    <div

        class="Join-A-Justserve-Activity-Banner-Image"

        [style.background-image]="'url(' + bannerImage + ')'">

        <!--========================================-->

        <div class="Join-A-Justserve-Activity-Banner-Overlay">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-xl-8 col-lg-9 col-md-10">

                        <div class="Join-A-Justserve-Activity-Banner-Content">

                            <!--========================-->

                            <div class="Join-A-Justserve-Activity-Banner-Logo">

                                <i [class]="bannerData.icon"></i>

                            </div>

                            <!--========================-->

                            <h1 class="Join-A-Justserve-Activity-Banner-Title">

                                {{bannerData.title}}

                            </h1>

                            <!--========================-->

                            <h4 class="Join-A-Justserve-Activity-Banner-SubTitle">

                                {{bannerData.subTitle}}

                            </h4>

                            <!--========================-->

                            <p class="Join-A-Justserve-Activity-Banner-Verse">

                                {{bannerData.verse}}

                            </p>

                            <!--========================-->

                            <span class="Join-A-Justserve-Activity-Banner-Scripture">

                                {{bannerData.scripture}}

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
