<app-header></app-header>



    <div
        class="hero-banner rounded-0 overflow-hidden shadow-sm mb-4"
        [style.background-image]="'url(' + hero.image + ')'">

        <div class="hero-overlay">

            <div class="container-fluid h-100">

                <div class="row h-100 align-items-center mobile-card">

                    <div class="col-lg-7">

                        <div class="hero-content">

                            <div class="mb-3">

                                <i class="bi bi-people-fill display-5 text-warning"></i>

                            </div>

                            <h1 class="display-3 fw-bold text-white">

                                {{hero.title}}

                            </h1>

                            <h4 class="text-white mt-3">

                                {{hero.subtitle}}

                            </h4>

                            <p class="mt-4 fst-italic text-white">

                                {{hero.verse}}

                            </p>

                            <strong class="text-warning">

                                {{hero.reference}}

                            </strong>

                        </div>

                    </div>

                    <div class="col-lg-5">

                        <!-- Empty -->
                        <!-- Background image already contains temple -->

                    </div>

                </div>

            </div>

        </div>

    </div>

<div class="container-fluid px-2 px-lg-3 pb-4">

    <!-- ================================================= -->
    <!-- HERO BANNER -->
    <!-- ================================================= -->






    <!-- ================================================= -->
    <!-- MAIN INFORMATION CARD -->
    <!-- ================================================= -->

    <div class="card border-0 shadow rounded-4 overflow-hidden">

        <div class="card-body p-3 p-lg-4">

            <div class="row g-4 align-items-center">

                <!-- LEFT -->

                <div class="col-lg-7">

                    <h2 class="fw-bold text-primary mb-4">

                        {{mainContent.title}}

                    </h2>

                    <div
                        *ngFor="let item of mainContent.paragraphs"
                        class="mb-3">

                        <p class="mb-0">

                            {{item}}

                        </p>

                    </div>

                </div>





                <!-- RIGHT IMAGE -->

                <div class="col-lg-5">

                    <img

                        [src]="mainContent.image"

                        class="img-fluid rounded-4 shadow-sm w-100 content-image"

                        alt="">

                </div>

            </div>

        </div>

    </div>





 










 


<!-- ========================================= -->
<!-- FEATURE GRID -->
<!-- ========================================= -->

<div class="row g-4 mt-3">

    <div
        class="col-lg-4 col-md-6"
        *ngFor="let card of featureCards">

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">

            <!-- Header -->

            <div class="card-header bg-white border-0 pb-0">

                <div class="d-flex align-items-center">

                    <div
                        class="feature-icon"

                        [ngClass]="{

                        'icon-gold':card.color=='warning',

                        'icon-blue':card.color=='primary',

                        'icon-purple':card.color=='success'

                        }">

                        <i class="bi {{card.icon}}"></i>

                    </div>

                    <div class="ms-3">

                        <h5 class="fw-bold mb-1">

                            {{card.title}}

                        </h5>

                    </div>

                </div>

            </div>

            <!-- Body -->

            <div class="card-body">

                <p class="text-muted">

                    {{card.description}}

                </p>

                <img

                    [src]="card.image"

                    class="img-fluid rounded-3 feature-img"

                    alt="">

            </div>

            <!-- Footer -->

            <div class="card-footer bg-white border-0">

                <button class="btn btn-warning rounded-pill w-100">

                    {{card.button}}

                    <i class="bi bi-arrow-right ms-2"></i>

                </button>

            </div>

        </div>

    </div>

</div>

<!-- card -->



 

</div>


<!-- ========================================= -->
<!-- BLUE FOOTER -->
<!-- ========================================= -->

<div class="footer-scripture mt-4 ">

    <div class="container-fluid py-4">

        <h5 class="text-center text-white fst-italic">

            "Behold, how good and how pleasant it is

            for brethren to dwell together in unity."

        </h5>

        <h6 class="text-center text-warning">

            Psalm 133:1

        </h6>

        <hr class="border-light">

        <div class="row text-center">

            <div

                class="col-lg col-md-4 col-6 mb-2"

                *ngFor="let item of scriptures">

                <small>

                    {{item}}

                </small>

            </div>

        </div>

    </div>

</div>
