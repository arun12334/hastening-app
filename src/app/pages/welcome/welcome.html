
<section class="welcome-page-Banner" >

    <div  
        class="welcome-page-Banner-Image"
        [style.background-image]="'url(' + bannerImage + ')'">

    
    </div>

</section>

<main class="welcome-page-Content-X56563-Y76776">
     
    <section class="welcome-page-Actions-X56563-Y76776" aria-labelledby="welcome-title">
        <div class="welcome-page-Actions-Intro-X56563-Y76776">
            <span class="welcome-page-Eyebrow-X56563-Y76776">Your journey starts here</span>
            <h2 id="welcome-title">Choose how you would like to continue</h2>
            <p>Connect with a caring community built around faith, service, and unity.</p>
        </div>
        <div class="welcome-page-Action-Grid-X56563-Y76776">
            <button type="button" class="welcome-page-Action-Button-X56563-Y76776 welcome-page-Login-Button-X56563-Y76776" (click)="goToMemberLogin()"><i class="bi bi-person-check-fill"></i><span><strong>Member Login</strong><small>Continue to your account</small></span><i class="bi bi-arrow-right"></i></button>
            <button type="button" class="welcome-page-Action-Button-X56563-Y76776 welcome-page-Guest-Button-X56563-Y76776" (click)="continueAsGuest()"><i class="bi bi-globe2"></i><span><strong>Guest Mode</strong><small>Explore the community</small></span><i class="bi bi-arrow-right"></i></button>
            <button type="button" class="welcome-page-Action-Button-X56563-Y76776 welcome-page-Register-Button-X56563-Y76776" (click)="goToRegistration()"><i class="bi bi-person-plus-fill"></i><span><strong>Register</strong><small>Become part of the family</small></span><i class="bi bi-arrow-right"></i></button>
        </div>
    </section>
</main>
