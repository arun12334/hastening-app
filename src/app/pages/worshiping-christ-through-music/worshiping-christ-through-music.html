<app-header></app-header>
<!--==========================================================
NEIGHBORHOOD B&B BANNER
===========================================================-->

<section class="Neighborhood-Bb-Events-Banner">

    <div
        class="Neighborhood-Bb-Events-Banner-Image"
        [style.background-image]="'url(' + bannerImage + ')'">

        <!--==========================================================
        OVERLAY
        ===========================================================-->

        <div class="Neighborhood-Bb-Events-Banner-Overlay">

            <div class="container">

                <div class="row justify-content-center">

                    <div class="col-xl-8 col-lg-9 col-md-10">

                        <div class="Neighborhood-Bb-Events-Banner-Content">

                            <!--==========================================================
                            LOGO
                            ===========================================================-->

                            <div class="Neighborhood-Bb-Events-Banner-Logo">

                                <i [class]="bannerData.icon"></i>

                            </div>

                            <!--==========================================================
                            TITLE
                            ===========================================================-->

                            <h1 class="Neighborhood-Bb-Events-Banner-Title">

                                {{bannerData.title}}

                            </h1>

                            <!--==========================================================
                            SUB TITLE
                            ===========================================================-->

                            <h3 class="Neighborhood-Bb-Events-Banner-SubTitle">

                                {{bannerData.subtitle}}

                            </h3>

                            <!--==========================================================
                            DESCRIPTION
                            ===========================================================-->

                            <p class="Neighborhood-Bb-Events-Banner-Description">

                                {{bannerData.description}}

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

 
<!--==========================================================
NEIGHBORHOOD TAB MENU
===========================================================-->

<section class="Neighborhood-Bb-Events-Top-Tabs">

    <div class="container">

        <div class="Neighborhood-Bb-Events-Top-Tabs-Card">

            <div class="row g-0 flex-nowrap">

                @for(tab of bannerTabs;track tab.id){

                <div class="col">

                    <div
                        class="Neighborhood-Bb-Events-Top-Tab-Item"
                        [class.Active]="activeTab==tab.id"
                        (click)="changeTab(tab.id)">

                        <i [class]="tab.icon"></i>

                        <span>

                            {{tab.title}}

                        </span>

                    </div>

                </div>

                }

            </div>

        </div>

    </div>

</section>
